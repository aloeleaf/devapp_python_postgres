services:
  web:
    build:
      # Context is the project root (one level up from this file)
      context: ../
      # Path to Dockerfile relative to the build context (root)
      dockerfile: docker-compose/build/PYTHON_DOCKERFILE
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    container_name: ${COMPOSE_PROJECT_NAME}-web
    restart: always
    env_file:
      - ../.env
    environment:
      # Explicitly set the DB host, though .env usually handles this
      - POSTGRES_HOST=db
    volumes:
      # Mount the project root to /app so 'run.py' and 'app/' are visible
      - ../:/app
    # Updated command to point to the new entry point 'run.py'
    command: gunicorn --bind 0.0.0.0:5000 --reload run:app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - traefikproxy
    # --- TRAEFIK CONFIGURATION RESTORED ---
    labels:
      - "traefik.enable=true"
      # Uses the COMPOSE_PROJECT_NAME from .env to name the router
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`devapp.bpkornyekitvsz.birosagiad.hu`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      # Points Traefik to the internal port 5000 where Gunicorn is listening
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=5000"

  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: always
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge
  traefikproxy:
    name: traefikproxy
    external: true

volumes:
  pg-data:
